<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Health Tracker - BMI Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Family Health Tracker</h1>
            <p class="subtitle">Track BMI for your entire family</p>
        </header>

        <main>
            <!-- Profile Selection Section -->
            <section id="profile-section" class="card">
                <h2>Family Profiles</h2>
                <div id="profile-list" class="profile-grid"></div>
                <button class="btn btn-primary" id="add-profile-btn">+ Add Family Member</button>
            </section>

            <!-- Add/Edit Profile Modal -->
            <div id="profile-modal" class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
                <div class="modal-content">
                    <button class="close" aria-label="Close modal">&times;</button>
                    <h2 id="modal-title">Add Family Member</h2>
                    <form id="profile-form">
                        <div class="form-group">
                            <label for="profile-name">Name:</label>
                            <input type="text" id="profile-name" required>
                        </div>
                        <div class="form-group">
                            <label for="profile-age">Age:</label>
                            <input type="number" id="profile-age" min="1" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="profile-gender">Gender:</label>
                            <select id="profile-gender" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="profile-ethnicity">Ethnicity:</label>
                            <select id="profile-ethnicity" required>
                                <option value="">Select Ethnicity</option>
                                <option value="asian">Asian</option>
                                <option value="black">Black/African</option>
                                <option value="white">White/Caucasian</option>
                                <option value="hispanic">Hispanic/Latino</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <button type="button" class="btn btn-secondary" id="cancel-profile-btn">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- BMI Data Entry Section -->
            <section id="bmi-section" class="card" style="display: none;">
                <div class="section-header">
                    <h2 id="current-profile-name">BMI Data</h2>
                    <button class="btn btn-secondary" id="back-to-profiles-btn">← Back to Profiles</button>
                </div>
                
                <div class="bmi-entry">
                    <h3>Add BMI Entry</h3>
                    <form id="bmi-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="weight">Weight (kg):</label>
                                <input type="number" id="weight" step="0.1" min="1" required>
                            </div>
                            <div class="form-group">
                                <label for="height">Height (cm):</label>
                                <input type="number" id="height" step="0.1" min="1" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="entry-date">Date:</label>
                            <input type="date" id="entry-date" max="" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Calculate & Save BMI</button>
                    </form>
                </div>

                <div class="bmi-result" id="bmi-result" style="display: none;">
                    <h3>Current BMI</h3>
                    <div class="bmi-value" id="bmi-value"></div>
                    <div class="bmi-category" id="bmi-category"></div>
                </div>

                <div class="bmi-history">
                    <h3>BMI History</h3>
                    <div id="bmi-history-list"></div>
                </div>

                <div class="comparison-section">
                    <h3>Compare with Average Data</h3>
                    <button class="btn btn-info" id="compare-btn">View Comparison Data</button>
                </div>
            </section>

            <!-- Comparison Modal -->
            <div id="comparison-modal" class="modal" role="dialog" aria-labelledby="comparison-title" aria-modal="true">
                <div class="modal-content">
                    <button class="close" aria-label="Close modal">&times;</button>
                    <h2 id="comparison-title">BMI Comparison Data</h2>
                    <div id="comparison-content"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>Family Health Tracker &copy; 2026 | Keep your family healthy!</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>

<section class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">Dashboard</h1>
      <p class="text-sm text-slate-500">Track family health metrics and trends at a glance.</p>
    </div>
    <button class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white">
      Add family member
    </button>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-sm font-semibold uppercase text-slate-400">Global unit</h2>
      <div class="mt-3 flex items-center gap-2">
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="unit" checked class="accent-slate-900" />
          Metric (kg/m)
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="radio" name="unit" class="accent-slate-900" />
          Imperial (lb/ft/in)
        </label>
      </div>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-sm font-semibold uppercase text-slate-400">Health averages</h2>
      <p class="mt-2 text-sm text-slate-600">
        Compare against population data by age, gender, and ethnicity.
      </p>
      <button class="mt-3 rounded-xl border border-slate-200 px-3 py-2 text-sm">Configure source</button>
    </div>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div
      *ngFor="let member of familyMembers"
      class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
    >
      <h3 class="text-lg font-semibold">{{ member.name }}</h3>
      <p class="text-sm text-slate-500">Age {{ member.age }} · {{ member.gender }}</p>
      <div class="mt-4 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">Last BMI</p>
          <p class="text-xl font-semibold">24.2</p>
        </div>
        <a
          [routerLink]="['/members', member.id]"
          class="rounded-full bg-slate-900 px-3 py-1 text-xs font-semibold text-white"
        >
          View
        </a>
      </div>
    </div>
  </div>
</section>

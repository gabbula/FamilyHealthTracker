<section class="mx-auto flex w-full max-w-md flex-col gap-6">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold">Welcome back</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in and verify the OTP sent to your email.</p>

    <form class="mt-5 space-y-4">
      <label class="block text-sm font-medium">
        Email
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none"
          placeholder="you@example.com"
        />
      </label>

      <label class="block text-sm font-medium">
        Password
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none"
          placeholder="••••••••"
        />
      </label>

      <button type="button" class="w-full rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white">
        Send OTP
      </button>
    </form>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-lg font-semibold">Verify OTP</h2>
    <form class="mt-4 space-y-4">
      <label class="block text-sm font-medium">
        One-time password
        <input
          [(ngModel)]="otp"
          name="otp"
          type="text"
          class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none"
          placeholder="123456"
        />
      </label>
      <button type="button" class="w-full rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white">
        Verify &amp; Continue
      </button>
    </form>
  </div>
</section>
